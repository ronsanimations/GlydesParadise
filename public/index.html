<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Critical tag to prevent smartphones from shrinking the page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glyde's Paradise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Character Design Studio Overlay Panel -->
    <div id="customizer-screen">
        <div id="customizer-box">
            <h2>Character Design Studio</h2>
            
            <div class="input-group">
                <label for="usernameInput">Character Name:</label>
                <input type="text" id="usernameInput" value="New Glyder" maxlength="32">
            </div>

            <div class="customizer-split-layout">
                <!-- Left Control Column: Sliders -->
                <div class="customizer-left">
                    <div class="control-row">
                        <label>Body Style:</label>
                        <div class="selector-arrows">
                            <button onclick="changeStyle('bodyStyle', -1)">◀</button>
                            <span id="bodyStyleDisplay">1</span>
                            <button onclick="changeStyle('bodyStyle', 1)">▶</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <label>Hair Style:</label>
                        <div class="selector-arrows">
                            <button onclick="changeStyle('hairStyle', -1)">◀</button>
                            <span id="hairStyleDisplay">1</span>
                            <button onclick="changeStyle('hairStyle', 1)">▶</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <label>Shirt Style:</label>
                        <div class="selector-arrows">
                            <button onclick="changeStyle('shirtStyle', -1)">◀</button>
                            <span id="shirtStyleDisplay">1</span>
                            <button onclick="changeStyle('shirtStyle', 1)">▶</button>
                        </div>
                    </div>

                    <div style="margin-top: 5px;">
                        <label style="font-size: 13px; display: block; margin-bottom: 4px;">Paint Layer Brush:</label>
                        <select id="paintLayerSelect">
                            <option value="body">Paint Body Layer</option>
                            <option value="hair">Paint Hair Layer</option>
                            <option value="shirt">Paint Shirt Layer</option>
                        </select>
                    </div>
                </div>

                <!-- Right Preview Column: Canvas -->
                <div class="customizer-right">
                    <span style="font-size: 11px; color: #888; font-weight: bold;">PAINT ON CHARACTER</span>
                    <canvas id="paintCanvas" width="128" height="128"></canvas>
                    <div class="paint-btn-row">
                        <input type="color" id="brushColorPicker" value="#ffffff">
                        <button id="clearPaintBtn">Reset</button>
                    </div>
                </div>
            </div>

            <button id="joinGameBtn">Enter Glyde's Paradise</button>
        </div>
    </div>

    <!-- Main Game UI Layout -->
    <div id="ui-wrapper" style="display: none;">
        <div id="game-container">
            <div id="debug-coords">Position - X: 0, Y: 0</div>
            
            <!-- Mobile Toggle Buttons for UI Overlay Controls -->
            <button id="mobileChatToggleBtn" onclick="toggleMobileChat()">💬 Toggle Chat Log</button>
            
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div id="chat-bar">
                <input type="text" id="chatInput" placeholder="Tap here or press Enter to chat..." maxlength="60" autocomplete="off">
            </div>

            <!-- Virtual Touch Joystick overlay (Pops up automatically on touch devices) -->
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>
        </div>
        
        <div id="chat-log-box">
            <h3>Server Chat</h3>
            <div id="chatLog"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
