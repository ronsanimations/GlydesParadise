<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glyde's Paradise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Character Design Studio Overlay Panel -->
    <div id="customizer-screen">
        <div id="customizer-box">
            <h2>Character Design Studio</h2>
            <div class="input-group">
                <label for="usernameInput">Character Name:</label>
                <input type="text" id="usernameInput" value="New Glyder" maxlength="32">
            </div>

            <div class="customizer-split-layout">
                <!-- Left Control Column: Sliders -->
                <div class="customizer-left">
                    <div class="control-row">
                        <label>Body Style:</label>
                        <div class="selector-arrows">
                            <button type="button" onclick="changeStyle('bodyStyle', -1)">◀</button>
                            <span id="bodyStyleDisplay">1</span>
                            <button type="button" onclick="changeStyle('bodyStyle', 1)">▶</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <label>Hair Style:</label>
                        <div class="selector-arrows">
                            <button type="button" onclick="changeStyle('hairStyle', -1)">◀</button>
                            <span id="hairStyleDisplay">1</span>
                            <button type="button" onclick="changeStyle('hairStyle', 1)">▶</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <label>Shirt Style:</label>
                        <div class="selector-arrows">
                            <button type="button" onclick="changeStyle('shirtStyle', -1)">◀</button>
                            <span id="shirtStyleDisplay">1</span>
                            <button type="button" onclick="changeStyle('shirtStyle', 1)">▶</button>
                        </div>
                    </div>
                    <div style="margin-top: 5px;">
                        <label style="font-size: 13px; display: block; margin-bottom: 4px;">Paint Layer Brush:</label>
                        <select id="paintLayerSelect">
                            <option value="body">Paint Body Layer</option>
                            <option value="hair">Paint Hair Layer</option>
                            <option value="shirt">Paint Shirt Layer</option>
                        </select>
                    </div>
                </div>

                <!-- Right Preview Column: Canvas -->
                <div class="customizer-right">
                    <span style="font-size: 11px; color: #888; font-weight: bold;">PAINT ON CHARACTER</span>
                    <canvas id="paintCanvas" width="128" height="128"></canvas>
                    <div class="paint-btn-row">
                        <input type="color" id="brushColorPicker" value="#ffffff">
                        <button type="button" id="clearPaintBtn">Reset</button>
                    </div>
                </div>
            </div>
            <button type="button" id="joinGameBtn">Enter Glyde's Paradise</button>
        </div>
    </div>

    <!-- Main Game UI Layout -->
    <div id="ui-wrapper" style="display: none;">
        <div id="game-container">
            <!-- Pinned Audio Soundtrack Control Button Layer -->
            <button type="button" id="audioMuteBtn" onclick="toggleBackgroundMusic()" style="position: absolute; top: 10px; right: 15px; z-index: 20; background: rgba(0,0,0,0.7); color: #55ff55; border: 1px solid #444; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">🎵 Music: OFF</button>
            
            <!-- Dynamic Single-Audio Receiver Node injector for Multi-Track Loops -->
            <audio id="bgMusicTrack"></audio>

            <!--this nect line is for dev cords, enable for knowing location in x and y-->
            <!-- <div id="debug-coords">Position - X: 0, Y: 0</div> -->
            
            <!--just inbetween these comments is the code-->
            <button type="button" id="mobileChatToggleBtn" onclick="toggleMobileChat()">💬 Toggle Chat Log</button>
            
            <!-- Canvas Resolution -->
            <canvas id="gameCanvas" width="800" height="700"></canvas>
            
            <form id="chatForm" onsubmit="handleChatSubmit(event)">
                <input type="text" id="chatInput" placeholder="Press Enter or tap Send..." maxlength="60" autocomplete="off">
                <button type="submit" id="chatSendBtn">Send</button>
            </form>

            <!-- Bottom Controller Bar (Dedicated zone below the playing field) -->
            <div id="mobile-controls-bar">
                <div id="joystick-zone">
                    <div id="joystick-base">
                        <div id="joystick-stick"></div>
                    </div>
                </div>
                <div id="mobile-hint">Drag circle to move</div>
            </div>
        </div>

        <div id="chat-log-box">
            <h3>Server Chat</h3>
            <div id="chatLog"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
