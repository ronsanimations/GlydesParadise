<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glyde's Paradise Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Combined Character Preview Paint Studio -->
    <div id="customizer-screen">
        <div id="customizer-box" style="width: 520px;">
            <h2>Character Design Studio</h2>
            
            <div class="input-group">
                <label for="usernameInput">Character Name:</label>
                <input type="text" id="usernameInput" value="New Glyder" maxlength="32">
            </div>

            <div style="display: flex; gap: 20px; margin-top: 15px;">
                <!-- Left Control Column: Hair, Body, Shirt Selection Arrows -->
                <div style="flex: 1; display: flex; flex-direction: column; gap: 15px;">
                    <div class="control-row">
                        <label>Body Style:</label>
                        <div class="selector-arrows">
                            <button onclick="changeStyle('bodyStyle', -1)">◀</button>
                            <span id="bodyStyleDisplay">1</span>
                            <button onclick="changeStyle('bodyStyle', 1)">▶</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <label>Hair Style:</label>
                        <div class="selector-arrows">
                            <button onclick="changeStyle('hairStyle', -1)">◀</button>
                            <span id="hairStyleDisplay">1</span>
                            <button onclick="changeStyle('hairStyle', 1)">▶</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <label>Shirt Style:</label>
                        <div class="selector-arrows">
                            <button onclick="changeStyle('shirtStyle', -1)">◀</button>
                            <span id="shirtStyleDisplay">1</span>
                            <button onclick="changeStyle('shirtStyle', 1)">▶</button>
                        </div>
                    </div>

                    <div style="margin-top: 5px;">
                        <label style="font-size: 13px; display: block; margin-bottom: 5px;">Paint Layer Brush:</label>
                        <select id="paintLayerSelect" style="width: 100%; padding: 6px; background: #111; color: #55ff55; border: 1px solid #444; border-radius: 4px; font-weight: bold; cursor: pointer;">
                            <option value="body">Paint Body Layer</option>
                            <option value="hair">Paint Hair Layer</option>
                            <option value="shirt">Paint Shirt Layer</option>
                        </select>
                    </div>
                </div>

                <!-- Right Preview Column: Direct Paint Canvas Window -->
                <div style="flex: 1; background: #1a1a1a; padding: 15px; border-radius: 6px; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <span style="font-size: 12px; color: #888; font-weight: bold;">PAINT DIRECTLY ON CHARACTER</span>
                    
                    <canvas id="paintCanvas" width="160" height="160" style="background-color: #222; border: 2px solid #55ff55; cursor: crosshair; image-rendering: pixelated; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);"></canvas>
                    
                    <div style="display: flex; gap: 10px; width: 100%; justify-content: center; align-items: center;">
                        <input type="color" id="brushColorPicker" value="#ffffff" style="width: 50px; height: 32px; border: none; cursor: pointer; background: none;">
                        <button id="clearPaintBtn" style="background: #ff5555; color: #000; border: none; padding: 6px 12px; font-weight: bold; font-size: 12px; border-radius: 4px; cursor: pointer; flex-grow: 1;">Reset Textures</button>
                    </div>
                </div>
            </div>

            <button id="joinGameBtn" style="margin-top: 20px;">Enter Glyde's Paradise</button>
        </div>
    </div>

    <!-- Main Game UI Layout (Hidden initially) -->
    <div id="ui-wrapper" style="display: none;">
        <div id="game-container">
            <!-- Pinned coordinate container panel for beta testing -->
            <div id="debug-coords">Position - X: 0, Y: 0</div>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div id="chat-bar">
                <input type="text" id="chatInput" placeholder="Press Enter to chat..." maxlength="60" autocomplete="off">
            </div>
        </div>
        <div id="chat-log-box">
            <h3>Server Chat</h3>
            <div id="chatLog"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
